version: '3.8'
services:
  app:
    build: .
    platform: linux/arm64
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Database=ClinicFrontDeskDb;User=sa;Password=Your_password123;
    depends_on:
      - db
    networks:
      - clinicnet
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "Your_password123"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    networks:
      - clinicnet
networks:
  clinicnet:
    driver: bridge
